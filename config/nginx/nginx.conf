# ============================================================
#  Nginx Reverse Proxy & Hardening Configuration
#  Đề 13: Website Portfolio Cá Nhân
# ============================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------- Hardening: Ẩn thông tin phiên bản Nginx ----------
    server_tokens off;

    # ---------- Định dạng Log kèm thời gian & thông tin chi tiết ----------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ---------- Tối ưu hoá hiệu năng ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    # ---------- Nén Gzip ----------
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ---------- Hardening: Rate Limiting chống Brute-force & DDoS ----------
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
    limit_req_status 429;

    # ---------- Upstream Services ----------
    upstream wordpress_backend {
        server wordpress:80;
        keepalive 32;
    }

    upstream phpmyadmin_backend {
        server phpmyadmin:80;
        keepalive 16;
    }

    # ---------- Server Block ----------
    server {
        listen 80;
        server_name localhost;

        # ---------- Hardening: Security Headers ----------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:;" always;

        # ---------- Prometheus Metrics Endpoint (Stub Status) ----------
        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ---------- Hardening: Chặn truy cập file ẩn (.env, .git, .htaccess) ----------
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------- Hardening: Chặn chạy file PHP trong thư mục tải lên uploads ----------
        location ~* /(?:uploads|files)/.*\.php$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------- Hardening: Chặn xmlrpc.php chống dò mật khẩu & DDoS Pingback ----------
        location = /xmlrpc.php {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------- Hardening: Chặn đọc trực tiếp các file nhạy cảm WordPress ----------
        location ~* /(?:wp-config\.php|readme\.html|license\.txt) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------- Hardening: Rate limit nghiêm ngặt cho trang đăng nhập wp-login.php ----------
        location = /wp-login.php {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://wordpress_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # ---------- Proxy tới phpMyAdmin (/pma/) ----------
        location ^~ /pma/ {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://phpmyadmin_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 300s;
        }

        # ---------- Route chính tới WordPress Portfolio Website ----------
        location / {
            limit_req zone=general_limit burst=40 nodelay;

            proxy_pass http://wordpress_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 90s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
