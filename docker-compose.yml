name: portfolio

# ============================================================
#  Đề 13 - Website Portfolio cá nhân
#  Stack: Nginx + WordPress + MySQL + phpMyAdmin
#  Monitoring & Logging: Prometheus + Grafana + Loki + Promtail
# ============================================================

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
  WORDPRESS_DB_USER: ${MYSQL_USER}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
  WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}

services:
  # ---------------- Database (MySQL 8) ----------------
  db:
    image: mysql:8.0
    container_name: portfolio-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  # ---------------- WordPress Application ----------------
  wordpress:
    image: wordpress:php8.3-apache
    container_name: portfolio-wordpress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('DISALLOW_FILE_EDIT', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
            $$_SERVER['HTTP_HOST'] = $$_SERVER['HTTP_X_FORWARDED_HOST'];
        }
    volumes:
      - wp_data:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    ports:
      - "127.0.0.1:${WP_PORT:-8090}:80"
    networks:
      - frontend
      - backend

  # ---------------- phpMyAdmin ----------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: portfolio-phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
      PMA_ABSOLUTE_URI: http://localhost:${NGINX_PORT:-8000}/pma/
    ports:
      - "127.0.0.1:${PMA_PORT:-8091}:80"
    networks:
      - frontend
      - backend

  # ---------------- Nginx Reverse Proxy (Hardened) ----------------
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["/bin/sh", "-c", "rm -f /var/log/nginx/access.log /var/log/nginx/error.log && exec nginx -g 'daemon off;'"]
    depends_on:
      - wordpress
      - phpmyadmin
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend
      - monitoring

  # ---------------- Nginx Prometheus Exporter ----------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: portfolio-nginx-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nginx
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    networks:
      - monitoring

  # ---------------- MySQL Prometheus Exporter ----------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: portfolio-mysqld-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/mysql/exporter.cnf:/.my.cnf:ro
    networks:
      - backend
      - monitoring

  # ---------------- cAdvisor (Container Resource Metrics) ----------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portfolio-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # ---------------- Prometheus Metrics Server ----------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: portfolio-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  # ---------------- Loki Log Aggregator ----------------
  loki:
    image: grafana/loki:3.0.0
    container_name: portfolio-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  # ---------------- Promtail Log Collector ----------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: portfolio-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # ---------------- Grafana Dashboard ----------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: portfolio-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  # ---------------- WP-CLI Setup Profile ----------------
  wpcli:
    image: wordpress:cli-php8.3
    container_name: portfolio-wpcli
    profiles: ["setup"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *db-env
      HOME: /tmp
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wp_data:/var/www/html
      - ./setup:/setup:ro
    entrypoint: ["sh", "/setup/setup.sh"]
    networks:
      - backend

volumes:
  db_data:
  wp_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  frontend:
  backend:
  monitoring:
